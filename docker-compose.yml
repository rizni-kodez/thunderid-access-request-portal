services:
  postgres:
    image: postgres:16-alpine
    container_name: thunderid-portal-postgres
    environment:
      POSTGRES_DB: access_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - thunderid_portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d access_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  thunderid_portal_pgdata:
